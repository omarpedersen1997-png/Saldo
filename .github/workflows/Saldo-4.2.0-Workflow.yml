name: Build Saldo Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saldo-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package Saldo APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle 8.14.3
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 https://services.gradle.org/distributions/gradle-8.14.3-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.14.3/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-8.14.3/bin/gradle" --version

      - name: Configure Gradle dependency cache
        uses: gradle/actions/setup-gradle@v4

      - name: Locate and validate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR=""
          if [[ -f "$GITHUB_WORKSPACE/settings.gradle.kts" && -f "$GITHUB_WORKSPACE/app/build.gradle.kts" ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            while IFS= read -r settings_file; do
              candidate="$(dirname "$settings_file")"
              if [[ -f "$candidate/app/build.gradle.kts" ]]; then
                PROJECT_DIR="$candidate"
                break
              fi
            done < <(find "$GITHUB_WORKSPACE" -type f -name settings.gradle.kts -not -path '*/.gradle/*' -print)
          fi
          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::Android project not found. Expected settings.gradle.kts and app/build.gradle.kts."
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type f | head -150
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Using Android project: $PROJECT_DIR"
          sed -n '1,160p' "$PROJECT_DIR/settings.gradle.kts"
          sed -n '1,200p' "$PROJECT_DIR/app/build.gradle.kts"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle assembleDebug --no-daemon --stacktrace

      - name: Verify and stage APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          if [[ -z "$APK" || ! -s "$APK" ]]; then
            echo "::error::Build completed without producing a non-empty debug APK."
            find "$PROJECT_DIR" -type f -path '*/build/outputs/*' -print
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$APK" "$GITHUB_WORKSPACE/release/Saldo-4.2.0-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/release/Saldo-4.2.0-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saldo-4.2.0-Android-APK
          path: release/Saldo-4.2.0-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Saldo-build-diagnostics
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
