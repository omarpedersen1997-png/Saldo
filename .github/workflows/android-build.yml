
name: Build Saldo Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Find og udpak Saldo-projektet
        shell: bash
        run: |
          set -e

          ZIP_FILE="Saldo-Android-startpakke-ny-download.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "FEJL: Fandt ikke $ZIP_FILE i repositoryets rodmappe."
            echo "Kontrollér, at ZIP-filen er uploadet til GitHub."
            exit 1
          fi

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          SETTINGS_FILE=$(find extracted -type f -name "settings.gradle.kts" -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "FEJL: Fandt ikke settings.gradle.kts i ZIP-filen."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "FEJL: Fandt ikke app/build.gradle.kts."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Saldo-projekt fundet i: $PROJECT_DIR"

      - name: Byg Android APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Saldo-Android-debug-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
