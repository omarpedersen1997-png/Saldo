name: Build Saldo

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hent kildekoden
        uses: actions/checkout@v4

      - name: Konfigurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Find Android-projektet
        shell: bash
        run: |
          echo "=== REPOSITORYETS ROD ==="
          pwd
          ls -la

          echo "=== FINDER GRADLE-PROJEKT ==="
          SETTINGS=$(find . -type f \( \
            -name settings.gradle.kts -o \
            -name settings.gradle \
          \) -not -path '*/.gradle/*' | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "FEJL: Ingen settings.gradle-fil blev fundet."
            echo "Kontroller, at Android-projektets filer er uploadet."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Android-projekt fundet: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== PROJEKTETS GRADLE-FILER ==="
          find "$PROJECT_DIR" -maxdepth 3 -type f \
            \( -name build.gradle.kts -o -name build.gradle \) -print

      - name: Byg Saldo APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Gem APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Saldo-Android-debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
