name: Validate and build Saldo APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saldo-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Saldo debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Explicit package list prevents setup-android from installing the removed "tools" package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0

      - name: Install Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Validate project files
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          echo "Project root: $GITHUB_WORKSPACE"
          echo "Gradle settings:"
          sed -n '1,120p' settings.gradle.kts
          echo "App module:"
          sed -n '1,160p' app/build.gradle.kts

      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          gradle --version
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "::error::Expected APK not found or empty: $APK"
            find app/build/outputs -maxdepth 5 -type f -print 2>/dev/null || true
            exit 1
          fi
          mkdir -p release
          cp "$APK" release/Saldo-4.2.0-debug.apk
          sha256sum release/Saldo-4.2.0-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saldo-4.2.0-Android-APK
          path: release/Saldo-4.2.0-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Saldo-build-diagnostics
          path: |
            app/build/reports/**
            app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
