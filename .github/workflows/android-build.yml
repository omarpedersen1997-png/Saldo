name: Build Saldo Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Opsæt Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Opsæt Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Kontroller ZIP-fil
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="Saldo-3.9.0-moderne-funktioner.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "FEJL: $ZIP_FILE findes ikke i repositoryets rod."
            echo "Filer i repository:"
            ls -la
            exit 1
          fi
          unzip -t "$ZIP_FILE"

      - name: Pak projekt ud
        shell: bash
        run: |
          set -euo pipefail
          unzip -o "Saldo-3.9.0-moderne-funktioner.zip" -d .
          echo "Projektfiler:"
          find . -maxdepth 4 -type f | head -200

      - name: Find Android-projekt
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "saldo_online_work/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=saldo_online_work" >> "$GITHUB_ENV"
          elif [ -f "settings.gradle.kts" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            echo "FEJL: Fandt ikke settings.gradle.kts."
            find . -name settings.gradle.kts -print
            exit 1
          fi

      - name: Byg Android APK
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Saldo-Android-debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
