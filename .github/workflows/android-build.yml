name: Build Saldo Android APK

on:
push:
branches: [main]
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3
    with:
      packages: |
        platform-tools
        platforms;android-36
        build-tools;36.0.0

  - name: Install Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.13'

  - name: Locate Android project
    shell: bash
    run: |
      set -euo pipefail
      if [ -f "app/build.gradle.kts" ] && [ -f "settings.gradle.kts" ]; then
        PROJECT_DIR="$GITHUB_WORKSPACE"
      else
        PROJECT_DIR="$(find "$GITHUB_WORKSPACE" -type f -name settings.gradle.kts -not -path '*/.gradle/*' -print -quit | xargs -r dirname)"
      fi
      if [ -z "${PROJECT_DIR:-}" ] || [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
        echo "::error::Could not locate the Android project."
        exit 1
      fi
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

  - name: Build debug APK
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon --stacktrace

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Saldo-4.2.0-Android-APK
      path: '**/build/outputs/apk/debug/*.apk'
      if-no-files-found: error
      retention-days: 14
