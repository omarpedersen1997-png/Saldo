name: Saldo Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saldo-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build Saldo APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Find and validate Android project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR=''

          # Prefer the repository root if the Android project is there.
          if [[ -f "$GITHUB_WORKSPACE/settings.gradle.kts" || -f "$GITHUB_WORKSPACE/settings.gradle" ]]; then
            if [[ -f "$GITHUB_WORKSPACE/app/build.gradle.kts" || -f "$GITHUB_WORKSPACE/app/build.gradle" ]]; then
              PROJECT_DIR="$GITHUB_WORKSPACE"
            fi
          fi

          # Otherwise locate a nested project, avoiding Gradle cache folders.
          if [[ -z "$PROJECT_DIR" ]]; then
            while IFS= read -r settings_file; do
              candidate="$(dirname "$settings_file")"
              if [[ -f "$candidate/app/build.gradle.kts" || -f "$candidate/app/build.gradle" ]]; then
                PROJECT_DIR="$candidate"
                break
              fi
            done < <(find "$GITHUB_WORKSPACE" -type f \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/.gradle/*' -not -path '*/build/*' -print)
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            echo '::error::Android project not found. Expected settings.gradle(.kts) and app/build.gradle(.kts).'
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type f \( -name '*.gradle' -o -name '*.gradle.kts' \) -print
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Android project: $PROJECT_DIR"
          echo '--- Root build file ---'
          ls -la "$PROJECT_DIR"
          echo '--- App build file ---'
          ls -la "$PROJECT_DIR/app"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false

      - name: Check Gradle configuration
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle --version
          gradle tasks --no-daemon --stacktrace

      - name: Build debug APK
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Verify APK exists
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          if [[ -z "$APK" ]]; then
            echo '::error::Build completed but no debug APK was found.'
            find "$PROJECT_DIR" -type f -path '*/build/outputs/*' -print
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$APK" "$GITHUB_WORKSPACE/release/Saldo-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/release/Saldo-debug.apk" | tee "$GITHUB_WORKSPACE/release/SHA256SUMS.txt"
          echo "APK ready: $GITHUB_WORKSPACE/release/Saldo-debug.apk"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Saldo-Android-APK
          path: |
            release/Saldo-debug.apk
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostic logs if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Saldo-build-diagnostics
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
