name: Build Saldo Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Find og udpak Saldo-projektet
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Saldo-3.1.0-arbejdsversion.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "FEJL: $ZIP_FILE mangler i repositoryets rodmappe."
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          SETTINGS_FILE=$(find extracted -type f -name "settings.gradle.kts" -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "FEJL: settings.gradle.kts blev ikke fundet i ZIP-filen."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "FEJL: app/build.gradle.kts mangler."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Byg Android APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Upload APK som artefakt
        uses: actions/upload-artifact@v4
        with:
          name: Saldo-Android-debug-APK
          path: extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
