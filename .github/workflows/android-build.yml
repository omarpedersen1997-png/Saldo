name: Build Saldo Android APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

  - uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: "17"

  - name: Find og pak projektet ud
    shell: bash
    run: |
      set -euo pipefail
      ZIP_FILE="Saldo-professionel.zip"
      test -f "$ZIP_FILE" || { echo "ZIP-filen mangler"; ls -la; exit 1; }
      mkdir -p extracted
      unzip -oq "$ZIP_FILE" -d extracted
      PROJECT_DIR="$(find extracted -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit | xargs -r dirname)"
      test -n "$PROJECT_DIR" || { echo "Projektet blev ikke fundet"; exit 1; }
      test -f "$PROJECT_DIR/app/build.gradle.kts" || { echo "app/build.gradle.kts mangler"; exit 1; }
      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

  - name: Byg APK
    shell: bash
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    run: |
      set -euo pipefail
      cd "$PROJECT_DIR"
      chmod +x gradlew
      ./gradlew assembleDebug --no-daemon

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Saldo-Android-APK
      path: extracted/**/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
