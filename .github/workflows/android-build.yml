name: Validate and build Saldo APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saldo-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Find project, build APK, and upload result
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --licenses </dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Locate correct Gradle project
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$GITHUB_WORKSPACE"
          PROJECT=""

          # First prefer a directory containing both the settings file and app module.
          while IFS= read -r settings; do
            candidate="$(dirname "$settings")"
            if [[ -f "$candidate/app/build.gradle.kts" || -f "$candidate/app/build.gradle" ]]; then
              PROJECT="$candidate"
              break
            fi
          done < <(find "$ROOT" -type f \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/.gradle/*' -not -path '*/build/*' -print)

          # If settings is misplaced at the repository root, locate the actual app module
          # and use the closest settings file if one exists in the same directory.
          if [[ -z "$PROJECT" ]]; then
            while IFS= read -r appbuild; do
              candidate="$(dirname "$(dirname "$appbuild")")"
              if [[ -f "$candidate/settings.gradle.kts" || -f "$candidate/settings.gradle" ]]; then
                PROJECT="$candidate"
                break
              fi
            done < <(find "$ROOT" -type f \( -path '*/app/build.gradle.kts' -o -path '*/app/build.gradle' \) -not -path '*/.gradle/*' -not -path '*/build/*' -print)
          fi

          if [[ -z "$PROJECT" ]]; then
            echo "::error::Could not find a directory containing settings.gradle(.kts) and app/build.gradle(.kts)."
            echo "Gradle files found:"
            find "$ROOT" -type f \( -name settings.gradle -o -name settings.gradle.kts -o -name build.gradle -o -name build.gradle.kts \) -not -path '*/.gradle/*' -not -path '*/build/*' -print | head -200
            exit 1
          fi

          echo "Selected project directory: $PROJECT"
          echo "project_dir=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "Project files:"
          ls -la "$PROJECT"
          ls -la "$PROJECT/app"

      - name: Validate Gradle project structure
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          test -f settings.gradle.kts || test -f settings.gradle
          test -f app/build.gradle.kts || test -f app/build.gradle
          echo "settings file:"
          if [[ -f settings.gradle.kts ]]; then sed -n '1,160p' settings.gradle.kts; else sed -n '1,160p' settings.gradle; fi
          echo "app build file:"
          if [[ -f app/build.gradle.kts ]]; then sed -n '1,180p' app/build.gradle.kts; else sed -n '1,180p' app/build.gradle; fi

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f ./gradlew ]]; then
            chmod +x ./gradlew
            ./gradlew --version
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle --version
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Verify APK exists
        id: verify
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name '*.apk' -print -quit 2>/dev/null || true)"
          if [[ -z "$APK" || ! -s "$APK" ]]; then
            echo "::error::Gradle finished without producing an APK in app/build/outputs/apk."
            find "$PROJECT_DIR" -type f -path '*/build/outputs/*' -print || true
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$APK" "$GITHUB_WORKSPACE/release/Saldo-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/release/Saldo-debug.apk"
          echo "APK verified: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saldo-Android-APK
          path: release/Saldo-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Gradle diagnostics if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Saldo-build-diagnostics
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
