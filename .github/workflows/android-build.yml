name: Build Saldo Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Kontroller og udpak ZIP
        shell: bash
        run: |
          set -euxo pipefail

          ZIP_FILE="Saldo-projekt-ny.zip"
          test -f "$ZIP_FILE" || {
            echo "::error::Mangler $ZIP_FILE i repositoryets rodmappe"
            ls -la
            exit 1
          }

          unzip -t "$ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          SETTINGS="$(find extracted -type f \
            -name settings.gradle.kts -print -quit)"

          test -n "$SETTINGS" || {
            echo "::error::settings.gradle.kts blev ikke fundet"
            find extracted -maxdepth 4 -type f
            exit 1
          }

          PROJECT_DIR="$(dirname "$SETTINGS")"

          test -f "$PROJECT_DIR/app/build.gradle.kts" || {
            echo "::error::app/build.gradle.kts blev ikke fundet"
            exit 1
          }

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projektmappe: $PROJECT_DIR"

      - name: Byg Android APK
        shell: bash
        run: |
          set -o pipefail
          gradle -p "$PROJECT_DIR" assembleDebug \
            --no-daemon --stacktrace --info

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          find "$PROJECT_DIR" -type f -name '*.apk' -print

          APK="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          test -n "$APK" || {
            echo "::error::Ingen APK blev oprettet. Se trinnet Byg Android APK."
            exit 1
          }

          mkdir -p release
          cp "$APK" release/Saldo.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Saldo-Android-debug-APK
          path: release/Saldo.apk
          if-no-files-found: error
          retention-days: 14
