name: Build Saldo Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: saldo-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Saldo APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK environment
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install required Android SDK packages and accept licenses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p $ANDROID_SDK_ROOT/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fb8" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_SDK_ROOT/licenses/android-sdk-preview-license
          
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            https://services.gradle.org/distributions/gradle-8.13-bin.zip \
            --output "$RUNNER_TEMP/gradle-8.13-bin.zip"
          unzip -q "$RUNNER_TEMP/gradle-8.13-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.13/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-8.13/bin/gradle" --version

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR=""

          if [[ -f "$GITHUB_WORKSPACE/settings.gradle.kts" || -f "$GITHUB_WORKSPACE/settings.gradle" ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            while IFS= read -r settings_file; do
              candidate="$(dirname "$settings_file")"
              if [[ -f "$candidate/build.gradle.kts" || -f "$candidate/build.gradle" ]]; then
                PROJECT_DIR="$candidate"
                break
              fi
            done < <(find "$GITHUB_WORKSPACE" -type f \( -name settings.gradle.kts -o -name settings.gradle \) -not -path '*/.gradle/*' -print)
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            echo "::error::Could not find the Android project root."
            find "$GITHUB_WORKSPACE" -maxdepth 5 -type f \( -name '*.gradle' -o -name '*.gradle.kts' \) -print
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found at: $PROJECT_DIR"

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.project_dir }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          gradle assembleDebug --no-daemon --stacktrace --info

      - name: Verify APK output
        id: apk
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          if [[ -z "$APK" || ! -s "$APK" ]]; then
            echo "::error::Gradle finished without producing a non-empty debug APK."
            find "$PROJECT_DIR" -type f -path '*/build/outputs/*' -print
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$APK" "$GITHUB_WORKSPACE/release/Saldo-4.2.0-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/release/Saldo-4.2.0-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saldo-4.2.0-Android-APK
          path: release/Saldo-4.2.0-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Saldo-build-diagnostics
          path: |
            **/build/reports/**
            **/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
