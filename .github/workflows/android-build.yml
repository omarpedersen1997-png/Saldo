name: Build Saldo Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Udpak Saldo-projekt
        shell: bash
        run: |
          set -euo pipefail

          unzip -t Saldo-projekt-ny.zip
          mkdir -p extracted
          unzip -q Saldo-projekt-ny.zip -d extracted

          SETTINGS="$(find extracted -type f \
            -name settings.gradle.kts -print -quit)"

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle.kts blev ikke fundet."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::app/build.gradle.kts blev ikke fundet."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Byg Android APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Find og klargør APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK blev ikke fundet efter bygningen."
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/Saldo.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Saldo-Android-debug-APK
          path: release/Saldo.apk
          if-no-files-found: error
          retention-days: 14
