name: Build Saldo Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Udpak projekt
        shell: bash
        run: |
          set -euo pipefail
          unzip -t Saldo-professionel.zip
          mkdir -p extracted
          unzip -q Saldo-professionel.zip -d extracted

          SETTINGS="$(find extracted -type f \
            -name settings.gradle.kts -print -quit)"
          test -n "$SETTINGS" || {
            echo "::error::Gradle-projektet blev ikke fundet"
            exit 1
          }

          PROJECT_DIR="$(dirname "$SETTINGS")"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Byg APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"
          test -n "$APK" || {
            echo "::error::APK blev ikke oprettet"
            exit 1
          }
          mkdir -p release
          cp "$APK" release/Saldo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Saldo-Android-debug-APK
          path: release/Saldo.apk
          if-no-files-found: error
          retention-days: 14
