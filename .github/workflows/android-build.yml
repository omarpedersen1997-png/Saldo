Ret min eksisterende fil ".github/workflows/android-build.yml" direkte i GitHub-repositoryet.

VIGTIGT:

- Ret YAML-syntaksen, så GitHub Actions accepterer workflowet.
- Slet hele det nuværende indhold i filen, og erstat det med gyldig YAML.
- Behold workflow-navnet "Build Saldo Android APK".
- Workflowet skal starte ved push til "main" og manuelt via "workflow_dispatch".
- Brug Java 17.
- Download og brug Gradle 8.14.3 direkte.
- Pak "Saldo-professionel.zip" ud fra repositoryets rod.
- Find Android-projektets "settings.gradle.kts" eller "settings.gradle".
- Byg appen med "gradle assembleDebug --no-daemon --stacktrace".
- Brug GitHub Secrets "SUPABASE_URL" og "SUPABASE_ANON_KEY".
- Upload APK-filen som et artifact med navnet "Saldo-Android-APK".
- Sørg for korrekt YAML-indrykning med mellemrum, ikke tabulatorer.
- Kontrollér, at workflow-filen er gyldig YAML, før ændringerne afsluttes.
- Behold alle eksisterende projektfiler og appfunktioner.
- Ændr ikke Saldo-logoet.

Implementér ændringen direkte i filen. Lav ikke kun et forslag eller en forklaring. Fortæl mig bagefter, hvilke ændringer der blev gemt.
