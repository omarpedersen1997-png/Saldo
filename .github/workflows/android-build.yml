Redesign hele min eksisterende Android-app Saldo, så den får et gennemført, eksklusivt og moderne design, der føles som en professionel finansapp fra 2026 — ikke en app fra 2017.

VIGTIGT: Du skal implementere ændringerne direkte i projektets filer. Du må ikke nøjes med at beskrive, hvad der bør ændres.

1. Design og visuel identitet

- Behold det eksisterende Saldo-logo 100 % uændret. Redesign ikke logoet, dets farver eller form.
- Skab et moderne, minimalistisk og eksklusivt udtryk inspireret af nutidige fintech-apps.
- Designet skal være originalt og må ikke kopiere Cirka eller andre apps direkte.
- Brug dybe, elegante baggrundsfarver, raffinerede lilla accenter, diskrete farveovergange og tydelig kontrast.
- Brug moderne typografi, velafbalanceret afstand, afrundede kort og konsekvent visuel hierarki.
- Fjern det gammeldags udtryk med store, ensfarvede lilla knapper overalt.
- Brug moderne knapper, små ikoner, diskrete kanter og velovervejet brug af farver.
- Designet skal være flot på Android-telefoner i forskellige skærmstørrelser.
- Understøt mørkt tema ordentligt.

2. Animationer i stedet for grimme grafer

- Erstat de gammeldags grafer med moderne, levende visualiseringer, hvor det giver mening.
- Brug glidende talanimationer, animerede budgetbjælker, cirkulære fremgangsindikatorer og elegante overgange.
- Vis indtægter, udgifter, opsparing og rådighedsbeløb på en letforståelig måde.
- Animationerne skal være hurtige, glidende og diskrete — ikke overdrevne.
- Brug fade, slide, skaleringsanimationer og bløde overgange mellem skærme og kort.
- Undgå unødvendige animationer, som gør appen langsom.
- Respekter Androids indstilling for reduceret animation, hvor det er muligt.
- Brug ikke dekorative animationer, der skjuler vigtige økonomiske oplysninger.

3. Startside og økonomisk overblik

- Gør forsiden til et professionelt økonomisk dashboard.
- Vis månedens rådighedsbeløb tydeligt og elegant.
- Vis indtægter, udgifter, kommende regninger og budgetstatus i moderne kort.
- Gør det nemt at se, hvor mange penge der er tilbage indtil næste løn.
- Tilføj diskrete statusindikatorer og animerede tal, når data ændres.
- Prioritér de vigtigste oplysninger frem for at fylde skærmen med elementer.

4. Navigation

- Redesign bundnavigationen, så den fremstår moderne, enkel og intuitiv.
- Behold de eksisterende hovedfunktioner, men forbedr deres visuelle udtryk.
- Brug tydelige ikoner, en diskret markering af den aktive fane og glidende overgange.
- Sørg for, at navigationen ikke dækker indhold eller tekst.

5. Budget, poster og regninger

- Redesign alle skærme, så de følger samme designsystem.
- Gør budgetposter overskuelige med moderne kort, tydelige beløb og animerede statusindikatorer.
- Gør regninger nemme at forstå med forfaldsdato, beløb og status.
- Brug farver konsekvent til at skelne mellem indtægter, udgifter, betalte regninger og kommende betalinger.
- Gør formularer, dialogbokse, indtastningsfelter og valgmenuer moderne og behagelige at bruge.
- Bevar alle eksisterende funktioner og data.

6. Partner

- Erstat brugerrettet tekst med ordet "Partner" i stedet for "Kæreste".
- Opdatér relevante overskrifter, indstillinger, budgetsektioner og tekster i hele appen.
- Bevar den eksisterende funktionalitet for separate budgetter og fælles udgifter.

7. Animationer og teknisk kvalitet

- Undersøg først projektets eksisterende arkitektur og UI-teknologi.
- Brug den eksisterende teknologi og tilføj ikke unødvendige biblioteker.
- Genbrug eksisterende komponenter, hvor det giver mening, men modernisér dem grundigt.
- Undgå at oprette flere forskellige designsystemer.
- Sørg for, at animationer ikke forårsager fejl, hakken eller unødvendigt batteriforbrug.
- Bevar understøttelse af den eksisterende Android-version.
- Undgå at ændre database, beregninger, login, Supabase-konfiguration eller økonomisk logik, medmindre det er nødvendigt for at rette en konkret fejl.

8. Vigtige funktioner, der SKAL bevares

- Saldo-logoet skal være helt uændret.
- Alle eksisterende skærme og funktioner skal fortsat virke.
- Bevar brugerdata, budgetberegninger, regninger, sikkerhedskopier, PIN-kode og biometrisk oplåsning.
- Bevar PDF-eksport og sikkerhedskopiering.
- Bevar Supabase-login og onlinefunktioner.
- Bevar eksisterende navigation og dataformat.
- Fjern ikke funktioner, blot fordi de er besværlige at redesigne.
- Opfind ikke funktioner, der ser færdige ud, men ikke virker.

9. Gennemfør arbejdet

1. Undersøg hele projektet og identificér de relevante UI-filer.
2. Implementér det nye designsystem og redesign alle centrale skærme.
3. Tilføj animationer og moderne økonomiske visualiseringer.
4. Erstat "Kæreste" med "Partner" i brugergrænsefladen.
5. Kontrollér, at logoet er uændret.
6. Byg Android-appen, og ret eventuelle kompileringsfejl.
7. Kontrollér, at GitHub Actions-workflowet fortsat kan bygge APK-filen.
8. Kontrollér, at Supabase-secrets fortsat håndteres via BuildConfig og GitHub Secrets, og at ingen hemmelige nøgler indlejres i kildekoden.
9. Afslut med en kort oversigt over ændrede filer, implementerede forbedringer og eventuelle fejl, der stadig mangler at blive løst.

Målet er en komplet, gennemført redesign af Saldo med en moderne 2026-identitet, lækre animationer, professionel økonomisk visualisering og en enkel brugeroplevelse — uden at ændre logoet eller miste eksisterende funktioner.
