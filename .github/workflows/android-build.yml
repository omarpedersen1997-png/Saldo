name: Build Saldo Android APK

on:
workflow_dispatch:
push:
branches: [main]

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Hent repository
    uses: actions/checkout@v4

  - name: Opsæt Java
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '17'

  - name: Opsæt Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Pak projektet ud
    shell: bash
    run: |
      set -euo pipefail

      if [ ! -f "Saldo-professionel.zip" ]; then
        echo "FEJL: Saldo-professionel.zip findes ikke i repositoryets rod."
        ls -la
        exit 1
      fi

      mkdir -p extracted
      unzip -oq Saldo-professionel.zip -d extracted

      PROJECT_DIR="$(find extracted -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"

      if [ -z "$PROJECT_DIR" ]; then
        PROJECT_DIR="$(find extracted -type f -name settings.gradle -print -quit | xargs -r dirname)"
      fi

      if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
        echo "FEJL: Android-projektet kunne ikke findes i ZIP-filen."
        find extracted -maxdepth 4 -type f | head -100
        exit 1
      fi

      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
      echo "Projekt fundet: $PROJECT_DIR"

  - name: Byg APK
    shell: bash
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    run: |
      set -euo pipefail
      cd "$PROJECT_DIR"

      if [ ! -f gradlew ]; then
        echo "FEJL: Gradle-wrapperen gradlew mangler."
        exit 1
      fi

      chmod +x gradlew
      ./gradlew assembleDebug --no-daemon --stacktrace

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Saldo-Android-APK
      path: extracted/**/app/build/outputs/apk/debug/*.apk
      if-no-files-found: error
      retention-days: 14
