name: Build Saldo

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hent kildekoden
        uses: actions/checkout@v4

      - name: Konfigurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Kontroller projektmapper
        shell: bash
        run: |
          echo "Filer i repositoryets rod:"
          ls -la

          echo "Finder Android-projektet..."
          find . -name settings.gradle.kts -o -name settings.gradle

      - name: Byg Saldo APK
        run: gradle -p app assembleDebug --no-daemon

      - name: Gem APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Saldo-Android-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
