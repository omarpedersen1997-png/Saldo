name: Build Saldo Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Udpak og find Saldo-projektet
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="Saldo-download.zip"
          test -f "$ZIP_FILE" || {
            echo "::error::ZIP-filen mangler: $ZIP_FILE"
            exit 1
          }

          unzip -t "$ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          SETTINGS_FILE="$(find extracted -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -print -quit)"

          test -n "$SETTINGS_FILE" || {
            echo "::error::Gradle settings-fil blev ikke fundet"
            exit 1
          }

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          test -f "$PROJECT_DIR/app/build.gradle.kts" -o \
               -f "$PROJECT_DIR/app/build.gradle" || {
            echo "::error::Appens Gradle-fil blev ikke fundet"
            exit 1
          }

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Saldo-projekt: $PROJECT_DIR"

      - name: Byg APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Find den byggede APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK blev ikke oprettet. Se build-trinnets log."
            find "$PROJECT_DIR" -type d -path '*/build/outputs/*' -print
            exit 1
          fi

          mkdir -p release
          cp "$APK" release/Saldo.apk
          echo "APK klar: release/Saldo.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Saldo-Android-debug-APK
          path: release/Saldo.apk
          if-no-files-found: error
          retention-days: 14
