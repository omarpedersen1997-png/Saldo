name: Build Saldo

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Saldo-Android-startpakke.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hent kildekoden
        uses: actions/checkout@v4

      - name: Konfigurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Pak Android-projektet ud
        shell: bash
        run: |
          ZIP="Saldo-Android-startpakke.zip"

          if [ ! -f "$ZIP" ]; then
            echo "FEJL: ZIP-filen blev ikke fundet i repositoryets rod."
            ls -la
            exit 1
          fi

          mkdir -p extracted
          unzip -oq "$ZIP" -d extracted

          SETTINGS=$(find extracted -type f \
            -name settings.gradle.kts -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "FEJL: settings.gradle.kts blev ikke fundet."
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "FEJL: Android-modulet app blev ikke fundet."
            exit 1
          fi

          echo "Projektmappe: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Byg Android APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Upload Saldo APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Saldo-Android-debug-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
