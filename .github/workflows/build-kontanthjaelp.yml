name: Byg Kontanthjælp APK

on:
  push:
    paths:
      - 'kontanthjaelp/**'
      - '.github/workflows/build-kontanthjaelp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kontanthjaelp
    steps:
      - name: Hent koden
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Byg APK
        run: |
          chmod +x gradlew
          # Prøv igen ved midlertidige netværksfejl (fx 504 ved hentning af Gradle).
          for i in 1 2 3 4; do
            ./gradlew assembleDebug --no-daemon && exit 0
            echo "Forsøg $i fejlede, prøver igen om $((i * 15)) sekunder ..."
            sleep $((i * 15))
          done
          exit 1

      - name: Gem APK-filen
        uses: actions/upload-artifact@v4
        with:
          name: Kontanthjaelp-APK
          path: kontanthjaelp/app/build/outputs/apk/debug/*.apk
