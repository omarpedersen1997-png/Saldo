
name: Build Saldo 4.2.4 APK from ZIP

on:
  push:
    branches: [main]
    paths:
      - 'Saldo-4.2.4-Fix-Download.zip'
      - '.github/workflows/build-saldo-4-2-4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install Gradle 8.14.3
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-8.14.3-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.14.3/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-8.14.3/bin/gradle" --version

      - name: Locate or extract Saldo project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$GITHUB_WORKSPACE/app/build.gradle.kts" ] && [ -f "$GITHUB_WORKSPACE/settings.gradle.kts" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          elif [ -f "$GITHUB_WORKSPACE/Saldo-4.2.4-Fix-Download.zip" ]; then
            mkdir -p "$RUNNER_TEMP/saldo-project"
            unzip -oq "$GITHUB_WORKSPACE/Saldo-4.2.4-Fix-Download.zip" -d "$RUNNER_TEMP/saldo-project"
            PROJECT_DIR="$RUNNER_TEMP/saldo-project"
          else
            echo "::error::Android project or ZIP not found in repository root."
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] || [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "::error::ZIP does not contain the expected Android project at its top level."
            find "$PROJECT_DIR" -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Building project at $PROJECT_DIR"

      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon --stacktrace

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi
          mkdir -p release
          cp "$APK" release/Saldo-4.2.4-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saldo-4.2.4-Android-APK
          path: release/Saldo-4.2.4-debug.apk
          if-no-files-found: error
          retention-days: 14
          
