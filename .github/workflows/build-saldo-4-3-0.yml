
name: Build Saldo 4.3.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hent kildekoden
        uses: actions/checkout@v7

      - name: Opsaet Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Opsaet Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Installer Gradle 8.14.4
        shell: bash
        run: |
          set -euo pipefail

          curl -fL --retry 3 \
            https://services.gradle.org/distributions/gradle-8.14.4-bin.zip \
            -o "$RUNNER_TEMP/gradle.zip"

          unzip -q "$RUNNER_TEMP/gradle.zip" \
            -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-8.14.4/bin" >> "$GITHUB_PATH"

      - name: Find Android-projektet
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_DIR="$GITHUB_WORKSPACE"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then

            ZIP_FILE="$GITHUB_WORKSPACE/Saldo-4.3.0-Finpudset.zip"

            if [ ! -f "$ZIP_FILE" ]; then
              echo "::error::Android-projektets ZIP-fil mangler."
              find "$GITHUB_WORKSPACE" -maxdepth 3 -type f
              exit 1
            fi

            mkdir -p "$RUNNER_TEMP/saldo-project"
            unzip -oq "$ZIP_FILE" -d "$RUNNER_TEMP/saldo-project"

            SETTINGS_FILE="$(find "$RUNNER_TEMP/saldo-project" \
              -type f \
              \( -name settings.gradle.kts -o -name settings.gradle \) \
              -print -quit)"

            if [ -z "$SETTINGS_FILE" ]; then
              echo "::error::Gradle settings-filen mangler."
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "::error::App-modulets Gradle-fil mangler."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android-projekt: $PROJECT_DIR"

      - name: Ret Kotlin compiler-indstillinger
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])
          file = project / "app" / "build.gradle.kts"

          if not file.is_file():
              raise SystemExit(f"Gradle-fil mangler: {file}")

          text = file.read_text(encoding="utf-8-sig")

          old = re.compile(
              r'(?m)^[ \t]*kotlinOptions[ \t]*'
              r'\{[ \t]*jvmTarget[ \t]*=[ \t]*"17"'
              r'[ \t]*\}[ \t]*(?:\r?\n|$)'
          )

          text, count = old.subn("", text, count=1)

          if count != 1:
              raise SystemExit(
                  "Den forventede gamle jvmTarget-indstilling "
                  "blev ikke fundet."
              )

          import_line = (
              "import org.jetbrains.kotlin.gradle.dsl.JvmTarget"
          )

          if import_line not in text:
              text = import_line + "\n" + text

          text = text.rstrip() + """

          kotlin {
              compilerOptions {
                  jvmTarget.set(JvmTarget.JVM_17)
              }
          }
          """

          file.write_text(text + "\n", encoding="utf-8")
          print("Kotlin compiler-indstillinger rettet.")
          PY

      - name: Fastlaas kompatibel Compose-version
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])

          files = []
          for pattern in ("*.gradle", "*.gradle.kts", "libs.versions.toml"):
              files.extend(root.rglob(pattern))

          changed = False

          for file in dict.fromkeys(files):
              try:
                  text = file.read_text(encoding="utf-8-sig")
              except (OSError, UnicodeError):
                  continue

              updated_lines = []

              for line in text.splitlines(keepends=True):
                  new_line = line

                  if re.search(r"compose[-_.]?bom|composeBom",
                               line, re.IGNORECASE):
                      new_line, count = re.subn(
                          r"2026\.(?:07|08|09)\.\d{2}",
                          "2026.06.00",
                          new_line
                      )
                      if count:
                          changed = True

                  elif re.search(
                      r"androidx\.compose|compose[\w.-]*",
                      line,
                      re.IGNORECASE
                  ):
                      new_line, count = re.subn(
                          r"1\.12\.\d+",
                          "1.11.4",
                          new_line
                      )
                      if count:
                          changed = True

                  updated_lines.append(new_line)

              updated = "".join(updated_lines)

              if updated != text:
                  file.write_text(updated, encoding="utf-8")
                  print(f"Compose-indstilling rettet: {file}")

          if not changed:
              raise SystemExit(
                  "Ingen relevant Compose-version blev fundet. "
                  "Bygningen stoppes, saa en forkert version "
                  "ikke bruges ubemaerket."
              )

          print("Compose-kompatibilitetsrettelse udført.")
          PY

      - name: Byg Saldo APK
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          gradle -p "$PROJECT_DIR" \
            assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR" \
            -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK-filen blev ikke oprettet."
            find "$PROJECT_DIR" -type f -name '*.apk'
            exit 1
          fi

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"

      - name: Gem APK som download
        uses: actions/upload-artifact@v4
        with:
          name: Saldo-4.3.0-Android-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          retention-days: 14
