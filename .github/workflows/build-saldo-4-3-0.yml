
name: Build Saldo 4.3.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Hent kildekoden
        uses: actions/checkout@v4

      - name: Opsæt Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Opsæt Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Acceptér Android SDK-licenser
        shell: bash
        run: |
          set -o pipefail
          yes | sdkmanager --licenses

      - name: Kontrollér Gradle
        shell: bash
        run: |
          if [ ! -f gradlew ]; then
            echo "FEJL: gradlew mangler i projektets rod"
            exit 1
          fi
          chmod +x gradlew
          java -version
          ./gradlew --version

      - name: Byg Saldo APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug

      - name: Kontrollér APK
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "FEJL: APK-filen blev ikke oprettet"
            find . -path "*/build/outputs/apk/*" -type f
            exit 1
          fi
          ls -lh "$APK"

      - name: Gem APK
        uses: actions/upload-artifact@v4
        with:
          name: Saldo-4.3.0-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
