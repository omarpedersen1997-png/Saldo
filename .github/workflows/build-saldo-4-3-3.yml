name: Build Saldo 4.3.3

on:
  push:
    branches: [main]
    paths:
      - 'Saldo-4.3.3-Udgivelsesklar.zip'
      - '.github/workflows/build-saldo-4-3-3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Hent repository
        uses: actions/checkout@v7

      - name: Opsæt Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Opsæt Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Installér Android SDK-pakker
        shell: bash
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Installér Gradle 8.14.3
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-8.14.3-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.14.3/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-8.14.3/bin/gradle" --version

      - name: Pak kildekode ud
        shell: bash
        run: |
          set -euo pipefail
          ZIP="$GITHUB_WORKSPACE/Saldo-4.3.3-Udgivelsesklar.zip"
          if [ ! -f "$ZIP" ]; then
            echo "::error::Saldo-4.3.3-Udgivelsesklar.zip mangler i repositoryets rod."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/saldo-project"
          unzip -oq "$ZIP" -d "$RUNNER_TEMP/saldo-project"
          if [ ! -f "$RUNNER_TEMP/saldo-project/settings.gradle.kts" ]; then
            echo "::error::ZIP-filen mangler settings.gradle.kts i roden."
            find "$RUNNER_TEMP/saldo-project" -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "PROJECT_DIR=$RUNNER_TEMP/saldo-project" >> "$GITHUB_ENV"
          echo "Bygger projekt fra: $RUNNER_TEMP/saldo-project"

      - name: Kontrollér kildekode, manifest og logo
        run: python3 "$PROJECT_DIR/scripts/validate-saldo-source.py"

      - name: Byg debug-APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon --stacktrace

      - name: Kontrollér APK-identitet og opret kontrolsum
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "::error::APK blev ikke genereret."
            exit 1
          fi
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          BADGING="$("$AAPT" dump badging "$APK")"
          echo "$BADGING" | grep -F "package: name='dk.saldo.app' versionCode='30' versionName='4.3.3'"
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$APK" "$GITHUB_WORKSPACE/release/Saldo-4.3.3-debug.apk"
          (cd "$GITHUB_WORKSPACE/release" && sha256sum Saldo-4.3.3-debug.apk > SHA256SUMS.txt)

      - name: Byg signeret AAB, hvis upload-nøgle er konfigureret
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "::notice::Ingen komplet upload-keystore i GitHub Secrets. Spring AAB over; debug-APK'en er stadig tilgængelig."
            exit 0
          fi
          KEYSTORE="$RUNNER_TEMP/saldo-upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"
          ANDROID_KEYSTORE_PATH="$KEYSTORE" gradle -p "$PROJECT_DIR" bundleRelease --no-daemon --stacktrace
          AAB="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/bundle/release/*.aab' -print -quit)"
          if [ -z "$AAB" ] || [ ! -s "$AAB" ]; then
            echo "::error::Den signerede AAB-fil blev ikke oprettet."
            exit 1
          fi
          cp "$AAB" "$GITHUB_WORKSPACE/release/Saldo-4.3.3-release.aab"
          (cd "$GITHUB_WORKSPACE/release" && sha256sum Saldo-4.3.3-release.aab >> SHA256SUMS.txt)

      - name: Upload APK, eventuel AAB og SHA-256
        uses: actions/upload-artifact@v4
        with:
          name: Saldo-4.3.3-Android
          path: release/*
          if-no-files-found: error
          retention-days: 14
