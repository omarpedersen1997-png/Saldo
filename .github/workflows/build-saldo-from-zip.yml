name: Build Saldo APK from ZIP

on:
  push:
    branches: [main]
    paths:
      - 'Saldo-4.2.0-Redesign-2026.zip'
      - '.github/workflows/build-saldo-from-zip.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check ZIP exists
        shell: bash
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/Saldo-4.2.0-Redesign-2026.zip" || {
            echo '::error::Upload Saldo-4.2.0-Redesign-2026.zip to the root of the main branch first.'
            exit 1
          }

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install Gradle 8.14.3
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://services.gradle.org/distributions/gradle-8.14.3-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.14.3/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/gradle-8.14.3/bin/gradle" --version

      - name: Unpack ZIP and locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          UNPACK_DIR="$RUNNER_TEMP/saldo-unpacked"
          mkdir -p "$UNPACK_DIR"
          unzip -q "$GITHUB_WORKSPACE/Saldo-4.2.0-Redesign-2026.zip" -d "$UNPACK_DIR"

          PROJECT_DIR=""
          while IFS= read -r settings_file; do
            candidate="$(dirname "$settings_file")"
            if [ -f "$candidate/app/build.gradle.kts" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(find "$UNPACK_DIR" -type f -name settings.gradle.kts -not -path '*/.gradle/*' -print)

          if [ -z "$PROJECT_DIR" ]; then
            echo '::error::ZIP did not contain settings.gradle.kts and app/build.gradle.kts in the same Android project.'
            find "$UNPACK_DIR" -maxdepth 5 -type f | head -100
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project found at $PROJECT_DIR"

      - name: Build debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: gradle -p "${{ steps.project.outputs.project_dir }}" assembleDebug --no-daemon --stacktrace

      - name: Prepare APK artifact
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo '::error::Build completed without producing a debug APK.'
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/release"
          cp "$APK" "$GITHUB_WORKSPACE/release/Saldo-2026.apk"
          ls -lh "$GITHUB_WORKSPACE/release/Saldo-2026.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saldo-2026-Android-APK
          path: release/Saldo-2026.apk
          if-no-files-found: error
          retention-days: 14
          
